name: Publish Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml']
permissions:
  contents: read
concurrency:
  group: windows-release-v1.11.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install pywebview==6.2.1 pyinstaller==6.22.3
      - name: Test backend
        run: python -B tests/test_server.py
      - name: Test frontend
        run: node tests/test_frontend.js
      - name: Check version numbers
        shell: python
        run: |
          import sys; sys.path.insert(0, ".")          # shell: python 从临时文件运行，需要手动加入仓库目录
          import server
          wf = open(".github/workflows/windows-release.yml", encoding="utf-8").read()
          assert "GuangyingTutor-v" + server.APP_VERSION + "-Windows-x64" in wf, "workflow 与 server.py 的版本号不一致"
          js = open("web/js/core.js", encoding="utf-8").read()
          assert "const APP_VERSION = '" + server.APP_VERSION + "';" in js, "core.js 与 server.py 的版本号不一致"
          assert "## v" + server.APP_VERSION + "（" in open("CHANGELOG.md", encoding="utf-8").read(), "CHANGELOG 缺少本版本"
      - name: Build standalone application
        env:
          EXE_NAME: GuangyingTutor-v1.11.0-Windows-x64.exe
        run: |
          python build.py --version-file build/version_info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name GuangyingTutor-v1.11.0-Windows-x64 --icon assets/icon.ico --version-file build/version_info.txt --add-data "web;web" main.py
      - name: Verify package and prepare checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          exe = Path("dist/GuangyingTutor-v1.11.0-Windows-x64.exe")
          archive = CArchiveReader(str(exe))
          import sys; sys.path.insert(0, ".")
          import pefile, server
          pe = pefile.PE(str(exe))
          strings = {k.decode(): v.decode() for fi in pe.FileInfo[0] if fi.Key == b"StringFileInfo" for st in fi.StringTable for k, v in st.entries.items()}
          assert strings.get("FileVersion") == server.APP_VERSION and strings.get("ProductVersion") == server.APP_VERSION, strings
          print("exe 版本信息：", strings)
          forbidden = {"config.json", "default_config.json", "usage_log.jsonl", "lab_sessions.json", "report_who.json", "teaching.json"}
          assert not any(n.replace(chr(92), "/").split("/")[-1] in forbidden for n in archive.toc)
          for p in Path("web").rglob("*"):
              if p.is_file():
                  assert archive.extract(str(p)) == p.read_bytes(), str(p)
          Path("dist/SHA256.txt").write_text(hashlib.sha256(exe.read_bytes()).hexdigest() + "  " + exe.name + "\n", encoding="utf-8")
          Path("release-notes.md").write_text(
              "Windows 10/11 64 位独立程序，下载 exe 后双击运行，无需安装 Python。\n\n"
              "不内置 API Key。现象仿真和虚拟实验可离线使用；联网 AI 讲解、批改需在设置中填写自己的 DeepSeek API Key。\n\n"
              "v1.11.0 新增虚拟实验“分光计测三棱镜折射率（最小偏向角法）”（含实测数据处理与色散 n−1/λ² 作图）；作图法练习（坐标纸上画线取点求斜率，与最小二乘比较）；AI 批改先追问再点评，思考题按要点评分；不确定度误差预算条；方案优化题（二次成像法 D 取多大最好）；修正 D 的建议为略大于 4f。\n",
              encoding="utf-8")
      - name: Upload Windows executable for review
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GuangyingTutor-v1.11.0-Windows-x64
          path: |
            dist/GuangyingTutor-v1.11.0-Windows-x64.exe
            dist/SHA256.txt
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.11.0 dist/GuangyingTutor-v1.11.0-Windows-x64.exe dist/SHA256.txt --target "$env:GITHUB_SHA" --title "光影助教 v1.11.0 · Windows" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v1.11.0 --draft=false --latest
