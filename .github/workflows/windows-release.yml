name: Publish Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml']
permissions:
  contents: read
concurrency:
  group: windows-release-v1.4.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install pywebview==6.2.1 pyinstaller==6.22.3
      - name: Test backend
        run: python -B tests/test_server.py
      - name: Test frontend
        run: node tests/test_frontend.js
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name GuangyingTutor-v1.4.1-Windows-x64 --icon assets/icon.ico --add-data "web;web" main.py
      - name: Verify package and prepare checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          exe = Path("dist/GuangyingTutor-v1.4.1-Windows-x64.exe")
          archive = CArchiveReader(str(exe))
          forbidden = {"config.json", "default_config.json", "usage_log.jsonl", "lab_sessions.json"}
          assert not any(n.replace(chr(92), "/").split("/")[-1] in forbidden for n in archive.toc)
          for p in Path("web").rglob("*"):
              if p.is_file():
                  assert archive.extract(str(p)) == p.read_bytes(), str(p)
          Path("dist/SHA256.txt").write_text(hashlib.sha256(exe.read_bytes()).hexdigest() + "  " + exe.name + "\n", encoding="utf-8")
          Path("release-notes.md").write_text(
              "Windows 10/11 64 位独立程序，下载 exe 后双击运行，无需安装 Python。\n\n"
              "不内置 API Key。现象仿真和虚拟实验可离线使用；联网 AI 讲解、批改需在设置中填写自己的 DeepSeek API Key。\n\n"
              "v1.4.1 修复：波片消光位置和偏振极值的有效性检查，马吕斯定律与波片鉴别分开批改，拟合图恢复与重绘，牛顿环重测未补齐时暂停批改。\n",
              encoding="utf-8")
      - name: Upload Windows executable for review
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GuangyingTutor-v1.4.1-Windows-x64
          path: |
            dist/GuangyingTutor-v1.4.1-Windows-x64.exe
            dist/SHA256.txt
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.4.1 dist/GuangyingTutor-v1.4.1-Windows-x64.exe dist/SHA256.txt --target "$env:GITHUB_SHA" --title "光影助教 v1.4.1 · Windows" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v1.4.1 --draft=false --latest
